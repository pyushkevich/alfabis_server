# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

# The docs don't use autodoc (no need to install the itksnap-dss-server
# package itself) -- just Sphinx and the theme conf.py asks for.
python:
  install:
    - requirements: docs/requirements.txt
