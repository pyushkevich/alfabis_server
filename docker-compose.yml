# version: '3'
services:
  app:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
    #  - ALFABIS_SQLITE_PATH=/app/data/alfabis.sqlite3
      - ALFABIS_NOAUTH=1
    #volumes:
    #  - alfabis-data:/app/data
    #working_dir: /app/alfabis_server
    # No command override needed: the image's CMD (itksnap-dss --server) and
    # ENV ALFABIS_SQLITE_PATH already do the right thing, including
    # auto-initializing the schema on first startup if the DB file is missing.
  service:
    # docker/service/Dockerfile installs an x86_64-only ITK-SNAP release
    # tarball on top of python:3.12-slim; on Apple Silicon that image would
    # otherwise build natively as arm64 with a foreign x86_64 binary dropped
    # in, which is what breaks Rosetta translation. Pinning the whole
    # container to amd64 keeps the base image and the itksnap binary on the
    # same architecture, so Docker Desktop's Rosetta emulation applies
    # consistently. Requires Docker Desktop's "Use Rosetta for x86_64/amd64
    # emulation on Apple Silicon" setting enabled (on by default).
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/service/Dockerfile
    depends_on:
      - app
    links:
      - app
    environment:
      - DSS_URL=http://app:8080
      - DSS_SERVICE_HASH=e0a316038e9cbe6a000e07c82758532a8863f51f

volumes:
  alfabis-data:
