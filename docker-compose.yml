# version: '3'
services:
  app:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ALFABIS_NOAUTH=1
    volumes:
      # Bind-mount the host's ./datastore onto the same path itksnap-dss-server
      # already defaults to inside the container (datastore/, relative to
      # its WORKDIR) -- the database and uploaded ticket files land in a
      # folder visible on the host, instead of the container's ephemeral
      # filesystem, and restarting/rebuilding the container doesn't lose
      # data. Auto-init (itksnap_dss_server/db.py) creates and initializes
      # the database here on first run if it isn't already present.
      - ./datastore:/app/alfabis_server/datastore
    # No command override needed: the image's CMD (itksnap-dss-server
    # --server) already does the right thing.
  service:
    # docker/service/Dockerfile installs an x86_64-only ITK-SNAP release
    # tarball on top of python:3.12-slim; on Apple Silicon that image would
    # otherwise build natively as arm64 with a foreign x86_64 binary dropped
    # in, which is what breaks Rosetta translation. Pinning the whole
    # container to amd64 keeps the base image and the itksnap binary on the
    # same architecture, so Docker Desktop's Rosetta emulation applies
    # consistently. Requires Docker Desktop's "Use Rosetta for x86_64/amd64
    # emulation on Apple Silicon" setting enabled (on by default).
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/service/Dockerfile
    depends_on:
      - app
    links:
      - app
    environment:
      - DSS_URL=http://app:8080
      - DSS_SERVICE_HASH=e0a316038e9cbe6a000e07c82758532a8863f51f
