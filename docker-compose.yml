version: '3'
services:
  app:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ALFABIS_SQLITE_PATH=/app/data/alfabis.sqlite3
      - ALFABIS_NOAUTH=1
    volumes:
      - alfabis-data:/app/data
    working_dir: /app/alfabis_server
    # Initialize the SQLite schema only if the database file doesn't exist yet,
    # so restarting the container doesn't wipe a persistent volume's data.
    command: ["sh", "-c", "test -f \"$ALFABIS_SQLITE_PATH\" || sqlite3 \"$ALFABIS_SQLITE_PATH\" < sql/init_db_sqlite.sql; exec python app.py --server"]
  service:
    build:
      context: .
      dockerfile: ./docker/service/Dockerfile
    depends_on:
      - app
    links:
      - app
    environment:
      - DSS_URL=http://app:8080
      - DSS_SERVICE_HASH=e0a316038e9cbe6a000e07c82758532a8863f51f

volumes:
  alfabis-data:
